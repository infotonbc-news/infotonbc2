<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wer wird der nächste Chilliardär?</title>
<style>
:root{--gold:#e8d58a;--gold2:#b8993a;--bg:#07050d;--pur:#a64dff;--bl:#1b1650;--bl2:#2e2490;--tx:#f6f1dc;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) radial-gradient(ellipse at 50% 0,#2b1458 0,#07050d 70%) fixed;color:var(--tx);font-family:Oswald,"Arial Narrow",Impact,system-ui,sans-serif;min-height:100vh}
.w{max-width:900px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:14px}.brand img{height:clamp(70px,16vw,120px);width:clamp(70px,16vw,120px);border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 24px #a64dff88}
h1{font-size:clamp(1.3rem,5vw,2.4rem);margin:0;text-align:center;color:var(--gold);letter-spacing:1px;line-height:1.1;text-shadow:0 0 14px #a64dff88}
h1 small{display:block;font-size:.4em;color:var(--tx);letter-spacing:2px}
.lang button{background:none;border:1px solid var(--gold);color:var(--gold);padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit}
.lang button.on{background:var(--gold);color:#000}
.scr{margin-top:14px}
.card{background:#120c2acc;border:2px solid var(--gold2);border-radius:18px;padding:16px;margin:12px 0;font-family:system-ui,sans-serif;line-height:1.5}
.btn{background:linear-gradient(var(--gold),var(--gold2));color:#1a1200;border:0;border-radius:30px;padding:12px 26px;font:700 1.1rem Oswald,Impact,sans-serif;cursor:pointer;margin:6px 4px;letter-spacing:1px}
.btn.s{background:#2e2490;color:var(--gold);border:1px solid var(--gold)}
.btn:hover{filter:brightness(1.12)}
input{padding:10px;border-radius:10px;border:2px solid var(--gold2);background:#000;color:var(--tx);font:1rem system-ui;width:min(100%,320px)}
.mod{display:flex;gap:10px;align-items:center;margin:8px 0}
.mod img{width:72px;height:128px;object-fit:cover;object-position:top;border-radius:12px;border:2px solid var(--gold);flex:none}
.bub{background:#fff;color:#111;border-radius:14px;padding:10px 14px;font:.95rem system-ui,sans-serif;position:relative}
.lad{display:flex;gap:5px;overflow-x:auto;padding:6px 2px;scrollbar-width:thin}
.lad div{flex:none;padding:6px 10px;border:1px solid var(--gold2);border-radius:8px;font-size:.85rem;background:#150f36;color:var(--gold)}
.lad .sf{color:#fff;font-weight:700;border-color:#fff}
.lad .done{background:#2a5d2a}
.lad .cur{background:var(--gold);color:#000;font-weight:700;box-shadow:0 0 12px var(--gold)}
.jk{display:flex;justify-content:center;gap:10px;margin:8px 0}
.jk button{width:84px;height:54px;border-radius:50%/60%;border:2px solid var(--gold);background:var(--bl2);color:var(--gold);font:700 1rem Oswald,sans-serif;cursor:pointer}
.jk button:disabled{opacity:.35;text-decoration:line-through;cursor:default}
.q{background:linear-gradient(var(--bl2),var(--bl));border:2px solid var(--gold);border-radius:40px;padding:20px 26px;text-align:center;font-size:clamp(1.05rem,3.6vw,1.6rem);margin:10px 0;min-height:90px;display:flex;align-items:center;justify-content:center}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans{--c:polygon(5% 0,95% 0,100% 50%,95% 100%,5% 100%,0 50%);background:var(--gold);clip-path:var(--c);padding:2px;border:0;cursor:pointer;color:var(--tx);font:inherit;width:100%}
.ans span{display:block;clip-path:var(--c);background:linear-gradient(var(--bl2),var(--bl));padding:14px 22px;text-align:left;font-size:clamp(.9rem,3.2vw,1.2rem)}
.ans b{color:var(--gold);margin-right:8px}
.ans:hover:not(:disabled) span{background:#4a3cd0}
.ans.sel span{background:#e0b400;color:#000}.ans.ok span{background:#1f9d3a;color:#fff}.ans.no span{background:#c32626;color:#fff}
.ans.hid{visibility:hidden}
@media(max-width:560px){.g{grid-template-columns:1fr}}
.info{min-height:20px}
.bars{display:flex;gap:14px;align-items:flex-end;height:130px;justify-content:center}
.bars div{width:48px;text-align:center;font:.85rem system-ui}
.bars i{display:block;background:linear-gradient(var(--pur),var(--gold));border-radius:6px 6px 0 0;min-height:2px}
.cert{background:#fffaf0;color:#2a2110;border:8px double var(--gold2);border-radius:10px;padding:20px;text-align:center;font-family:Georgia,serif}
.cert img{height:90px;border-radius:50%;background:#000}
.cert h2{margin:6px 0;font-size:clamp(1.3rem,5vw,2rem);color:#6b2fb3}
.cert .n{font-size:1.6rem;border-bottom:2px solid var(--gold2);display:inline-block;padding:0 16px;margin:6px}
.cert p{margin:8px 0}
.row{text-align:center}
ol{padding-left:20px}
h1{text-align:left}h1 span{display:block;font-size:.5em;letter-spacing:3px;color:var(--tx)}
.studio{position:relative;border:2px solid var(--gold2);border-radius:22px;padding:14px;background:radial-gradient(circle at 12% 0,#5b2aa077,transparent 45%),radial-gradient(circle at 92% 8%,#e8d58a33,transparent 35%),linear-gradient(#150c33,#0a0618 70%,#1a1208);box-shadow:inset 0 0 50px #a64dff44;overflow:hidden}
.neon{text-align:center;color:var(--gold);font-size:clamp(.7rem,2.8vw,1.05rem);letter-spacing:4px;text-shadow:0 0 8px var(--gold),0 0 22px var(--pur);border:1px solid var(--gold2);border-radius:30px;padding:4px 14px;width:max-content;max-width:100%;margin:0 auto 12px;animation:fl 5s infinite}
@keyframes fl{0%,92%,100%{opacity:1}94%{opacity:.55}96%{opacity:1}98%{opacity:.7}}
.wl{position:absolute;right:14px;top:10px;width:52px;height:52px;border-radius:50%;opacity:.55}
.stage{display:flex;align-items:center;gap:16px;margin:6px 0 12px}
.host{flex:none;text-align:center}
.ring{width:160px;height:160px;border-radius:50%;border:4px solid var(--gold);overflow:hidden;box-shadow:0 0 0 7px #a64dff33,0 0 32px #a64dffaa;background:#8aa6e0;animation:fl2 6s ease-in-out infinite}
@keyframes fl2{50%{transform:translateY(-4px)}}
.ring img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.desk{margin-top:10px;background:linear-gradient(#6a4a18,#2a1c08);color:var(--gold);border-radius:8px;font-size:.8rem;padding:3px 10px;letter-spacing:2px;border-top:2px solid var(--gold2)}
.stage .bub{flex:1;font-size:1rem}.stage .bub:before{content:"";position:absolute;left:-9px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:#fff;border-left:0}
@media(max-width:560px){.ring{width:96px;height:96px}.wl{display:none}.stage{gap:12px}.stage .bub{font-size:.88rem}}
.cert{background:linear-gradient(#1c0f45,#0d0824 60%,#1d1409);color:#f6f1dc;border:6px double var(--gold);border-radius:14px;padding:22px 16px;box-shadow:0 0 40px #a64dff66,inset 0 0 60px #a64dff33}
.cert h2{color:var(--gold);letter-spacing:8px;font-size:clamp(1.8rem,7vw,3rem);text-shadow:0 0 16px var(--gold2)}
.cert .sub{font-style:italic;color:#d9c7ff}.cert .orn{color:var(--gold);letter-spacing:12px}
.cert .n{color:#fff;font-size:clamp(1.6rem,6vw,2.4rem);border-bottom:2px solid var(--gold)}
.cert .rk{font:700 clamp(1.6rem,6vw,2.6rem) Georgia,serif;color:var(--gold);text-shadow:0 0 14px #a64dff;margin:8px 0}
.cert .lb{margin:12px 0 0;font-size:.8rem;letter-spacing:3px;color:#d9c7ff}.cert .amt{font:700 clamp(1.8rem,7vw,3rem) Georgia,serif;color:#fff}
.cert .ft{font-size:.9rem;color:var(--gold)}
#win{position:fixed;inset:0;z-index:40;background:radial-gradient(circle,#3a1a7acc,#000e);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#win[hidden],#sto[hidden]{display:none}
#wt{font:700 clamp(2.2rem,11vw,6rem)/1.05 Oswald,Impact,sans-serif;color:#fff6c8;text-shadow:0 0 10px var(--gold),0 0 30px var(--gold),0 0 60px var(--pur),0 0 90px var(--pur);animation:fk 1.6s infinite}
@keyframes fk{0%,18%,22%,62%,66%,100%{opacity:1}20%,64%{opacity:.35}21%{opacity:.8}65%{opacity:.5}}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#sto{position:fixed;inset:0;z-index:45;background:#000e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;gap:8px}
#simg{max-height:74vh;max-width:90vw;aspect-ratio:9/16;border-radius:12px;box-shadow:0 0 30px #a64dffaa}
#shint{margin:0;font:.85rem system-ui;text-align:center;max-width:90vw}
@media print{body{background:#fff}.no-p{display:none!important}.cert{border-color:#999}}

chillz:"Chillz",rules:`<h2>How to play</h2><ol><li>You get <b>15 questions</b> of rising difficulty: general knowledge, culture, history, science and cannabis knowledge. Questions are reshuffled every round.</li><li>Tap an answer (A–D). It glows yellow: “Is that your final answer?” Then comes the reveal: green = right, red = wrong.</li><li>Every right answer moves you up one step, from <b>50 to 1,000,000 Chillz</b>.</li><li><b>Safe levels</b> at 1,000 and 16,000 Chillz: if you miss, you keep those Chillz.</li><li><b>3 lifelines, once each:</b> 50:50 (two wrong answers vanish), 📞 Phone a friend (Uncle Heiner knows almost everything) and 👥 Ask the crowd (the chill crowd votes).</li><li>You can <b>“Go chill”</b> at any time and take your Chillz with you.</li><li>At the end you get a <b>certificate</b> that honestly rates how much effort you put into your round.</li></ol><p>Follow us on Instagram: <b>@infotonbc</b> – No beef, just breathing. ✌️</p><p><small>Note: cannabis questions are a pure knowledge game. Use is not for minors – stay responsible.</small></p>`,

function walk(){if(g.lock)return;end(g.lvl,true)}
