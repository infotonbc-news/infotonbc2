<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NaturalBornChillaz CanG Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1d13;--ink:#111;--green:#3ddc4a;--yellow:#ffd400;--pink:#ff4fa3;--paper:#fff8dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{font-size:clamp(14px,1.1vw + 1.1vh,26px);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);background-image:radial-gradient(rgba(61,220,74,.18) 2px,transparent 2.5px),radial-gradient(circle at 50% 0,#1f4d30,var(--bg));background-size:22px 22px,100% 100%;color:var(--paper);font-family:'Nunito',system-ui,sans-serif;font-weight:700;overflow-x:hidden}
.wrap{max-width:46rem;margin:0 auto;padding:1rem 1rem 3rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
h1,h2,.btn,.hud,.flag b{font-family:'Bangers','Impact',sans-serif;letter-spacing:.06em;font-weight:400}
header{display:flex;align-items:center;gap:.9rem;width:100%}
.hl{flex:none;height:6.5rem;width:auto;border-radius:1rem;border:.25rem solid var(--yellow);box-shadow:.25rem .25rem 0 var(--ink);transform:rotate(-3deg)}
h1{margin:0;font-size:clamp(1.6rem,6vw,3.2rem);line-height:.95;color:var(--yellow);text-shadow:.12em .12em 0 var(--ink);-webkit-text-stroke:.04em var(--ink);paint-order:stroke fill}
h1 span{color:var(--green)}
.card{width:100%;background:var(--paper);color:var(--ink);border:.3rem solid var(--ink);border-radius:1.2rem;box-shadow:.45rem .45rem 0 var(--ink);padding:1.2rem}
.btn{display:inline-block;font-size:1.5rem;background:var(--green);color:var(--ink);border:.25rem solid var(--ink);border-radius:.9rem;padding:.5rem 1.4rem;box-shadow:.25rem .25rem 0 var(--ink);cursor:pointer;transition:transform .08s}
.btn:hover{transform:translate(-2px,-2px)}.btn:active{transform:translate(.2rem,.2rem);box-shadow:none}
.btn.y{background:var(--yellow)}.btn.p{background:var(--pink)}
.btn:focus-visible,.opt:focus-visible,.flag:focus-visible,.ic:focus-visible{outline:.25rem dashed var(--pink);outline-offset:3px}
h2{font-size:2rem;margin:.2rem 0}
.card p{margin:.4rem 0;line-height:1.4}
.flags{display:flex;flex-wrap:wrap;gap:.9rem;justify-content:center;margin-top:.8rem}
.flag{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.3rem;color:var(--ink);transition:transform .15s}
.flag:hover{transform:rotate(-6deg) scale(1.12)}
.fl{width:5.2rem;height:5.2rem;border-radius:50%;border:.28rem solid var(--ink);box-shadow:.25rem .25rem 0 var(--ink);background-size:cover;background-position:center}
.flag b{font-size:1.2rem}
.ranks{display:flex;gap:.6rem;margin:1rem 0;flex-wrap:wrap}
.rk{flex:1 1 7rem;border:.2rem solid var(--ink);border-radius:.8rem;padding:.5rem;text-align:center;font-size:.9rem}
.rk b{display:block;font-family:Bangers,Impact;font-weight:400;font-size:1.4rem;letter-spacing:.05em}
.hud{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:1.3rem;letter-spacing:.05em}
.bar{flex:1;height:1.1rem;margin:0 .8rem;background:var(--bg);border:.2rem solid var(--ink);border-radius:1rem;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--yellow));transition:width .4s}
#qtext{font-size:1.45rem;line-height:1.25;margin:0 0 1rem;font-weight:900}
.opts{display:grid;gap:.7rem}
.opt{text-align:left;font:inherit;font-weight:900;font-size:1.1rem;color:var(--ink);background:#fff;border:.2rem solid var(--ink);border-radius:.8rem;padding:.7rem .9rem;box-shadow:.2rem .2rem 0 var(--ink);cursor:pointer;display:flex;gap:.7rem;align-items:center}
.opt b{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--yellow);border:.18rem solid var(--ink);display:grid;place-items:center;font-family:Bangers,Impact;font-weight:400}
.opt:hover:not(:disabled){background:#e9ffe9}
.opt.ok{background:var(--green)}.opt.no{background:#ff6b6b;animation:shake .35s}.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#fact{margin-top:1rem;padding:.7rem .9rem;border-radius:.8rem;background:#fff2a8;border:.2rem dashed var(--ink)}
.hide{display:none!important}
.mute{position:fixed;right:.7rem;top:calc(.7rem + env(safe-area-inset-top,0px));z-index:5;font-size:1.1rem;padding:.3rem .8rem}
#modal{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.82);overflow:auto;display:flex;padding:1rem}
.mbox{margin:auto;width:min(100%,34rem);text-align:center;background:var(--paper);color:var(--ink);border:.3rem solid var(--ink);border-radius:1.2rem;padding:1rem;box-shadow:.45rem .45rem 0 var(--yellow)}
.mbox h2{font-size:2.2rem}.mbox p{line-height:1.35;margin:.5rem 0}
.mbox img{width:100%;max-height:55vh;object-fit:contain;border:.25rem solid var(--ink);border-radius:.6rem;background:#000}
.row{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:.8rem}
.row .btn{font-size:1.1rem;padding:.4rem 1rem}
.gold .mbox{background:linear-gradient(135deg,#fff3a0,#ffd400 50%,#ffb300);box-shadow:0 0 0 .3rem var(--pink),0 0 3rem var(--yellow);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.025)}}
.conf{position:fixed;top:-2rem;width:.7rem;height:1.1rem;z-index:11;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.ic{width:3.2rem;height:3.2rem;border-radius:50%;border:.2rem solid var(--ink);box-shadow:.18rem .18rem 0 var(--ink);display:grid;place-items:center;cursor:pointer;text-decoration:none;color:#fff;font:900 1.4rem/1 Nunito,sans-serif;padding:0;transition:transform .12s}
.ic:hover{transform:translateY(-3px) rotate(-6deg)}.ic svg{width:62%;height:62%}
.shr{margin-top:.8rem;font-size:1rem}
.foot{width:100%;display:flex;flex-direction:column;gap:1rem}
.pot{display:flex;gap:1rem;align-items:center}.pot>svg{flex:none;width:5rem;height:5rem}
.pot h2{margin:0;color:#b8860b}
.icons{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.6rem}
.social{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.imp{font-size:.85rem;line-height:1.4}.imp h3{font-family:Bangers,Impact;font-weight:400;font-size:1.3rem;margin:0 0 .3rem}
#pa{display:none}
@media print{body>*:not(#pa){display:none!important}#pa{display:block}#pa img{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<button class="btn y mute hide" id="mute"></button>
<div class="wrap">
 <header><img class="hl" id="hl" alt="NaturalBornChillaz Logo"><h1>NaturalBorn<span>Chillaz</span><br>CanG Quiz</h1></header>

 <section class="card" id="lang" style="text-align:center">
  <h2>🌐 Language · Sprache · Język · Idioma · Langue</h2>
  <div class="flags" id="flags"></div>
 </section>

 <section class="card hide" id="start">
  <h2 data-t="hi"></h2><p data-t="intro"></p>
  <div class="ranks" id="ranks"></div>
  <button class="btn" id="go" data-t="go"></button>
  <p style="font-size:.8rem;opacity:.75" data-t="note"></p>
 </section>

 <section class="hide" id="quiz" style="width:100%;display:flex;flex-direction:column;gap:1rem">
  <div class="hud"><span id="num"></span><div class="bar"><i id="prog"></i></div><span id="sc"></span></div>
  <div class="card">
   <p id="qtext"></p><div class="opts" id="opts"></div><div id="fact" class="hide"></div>
   <div class="row"><button class="btn hide" id="next"></button></div>
  </div>
 </section>

 <footer class="foot hide" id="foot">
  <section class="card">
   <div class="pot">
    <svg viewBox="0 0 64 64"><circle cx="21" cy="22" r="7" fill="#ffd400" stroke="#111" stroke-width="2"/><circle cx="34" cy="17" r="8" fill="#ffd400" stroke="#111" stroke-width="2"/><circle cx="45" cy="23" r="6" fill="#ffd400" stroke="#111" stroke-width="2"/><ellipse cx="32" cy="29" rx="23" ry="6" fill="#111"/><path d="M9 29c0 20 8 30 23 30s23-10 23-30z" fill="#2b2b2b" stroke="#111" stroke-width="3"/><text x="32" y="51" text-anchor="middle" font-family="Bangers,Impact" font-size="22" fill="#ffd400">€</text></svg>
    <div><h2 data-t="donT"></h2><p data-t="donTxt"></p></div>
   </div>
   <div class="icons" id="don"></div>
  </section>
  <div class="social" id="soc"></div>
  <section class="card imp"><h3 data-t="impr"></h3><p data-t="impTxt"></p><p>[Slawomir Wisniewski · NBC HQ ESSEN · infotonbc@gmail.com]</p></section>
 </footer>
</div>
<div id="pa"><img id="paImg" alt=""></div>

function show(){const q=Q[cur],A=(typeof q[1]=='string'?q[1]:q[1][L]).split('|');locked=false;$('num').textContent=t('qn',{a:cur+1,b:30});$('sc').textContent='✔ '+score;$('prog').style.width=(cur/30*100)+'%';
 $('qtext').textContent=q[0][L];$('fact').classList.add('hide');$('next').classList.add('hide');const o=$('opts');o.innerHTML='';
 shuffle([0,1,2,3]).forEach((idx,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+'ABCD'[i]+'</b><span></span>';b.lastChild.textContent=A[idx];b.dataset.ok=idx==0?1:0;b.onclick=()=>pick(b);o.appendChild(b)})}
function pick(b){if(locked)return;locked=true;const ok=b.dataset.ok==1;if(ok)score++;
 document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.ok==1)x.classList.add('ok')});if(!ok)b.classList.add('no');
 sfx(ok);$('sc').textContent='✔ '+score;$('fact').textContent=t(ok?'right':'wrong');$('fact').classList.remove('hide');
 $('next').textContent=t(cur==29?'res':'next');$('next').classList.remove('hide');$('next').focus()}
$('next').onclick=()=>{if(cur==29){finish();return}cur++;show()};
// Ergebnis
const RK={bronze:['#e8a15c','#8a4b17','c1','m1'],silver:['#f1f4f8','#7b8794','c2','m2'],gold:['#fff176','#ff9800','c3','m3']};
const rankOf=s=>s>=30?'gold':s>=25?'silver':s>=15?'bronze':null;
function sbtn(bg,html,href,title){const a=document.createElement(href?'a':'button');a.className='ic';a.style.background=bg;a.innerHTML=html;a.title=a.ariaLabel=title;if(href){a.href=href;a.target='_blank';a.rel='noopener'}return a}
async function finish(){$('prog').style.width='100%';const r=rankOf(score),m=$('mbox'),md=$('modal');md.classList.remove('hide');md.classList.toggle('gold',r=='gold');
 if(!r){m.innerHTML='<h2>'+t('lowT',{s:score})+'</h2><p>'+t('lowX')+'</p><div class="row"><button class="btn" id="again">'+t('again')+'</button></div>';$('again').onclick=begin;sfx(false);return}
 try{await document.fonts.load('40px Bangers','ąćęłńóśźżŚŻéèêçàùâîôûÉÑ¡¿')}catch(e){}
 const rn=t(r),url=drawCert(r,score);$('paImg').src=url;
 m.innerHTML='<h2>'+(r=='gold'?t('gt'):t('rt',{r:rn}))+'</h2><p><b>'+t('sc',{s:score})+'</b></p><p>'+t(RK[r][3])+'</p><img src="'+url+'" alt=""><p style="font-size:.85rem">'+t('hint')+'</p><div class="row"><button class="btn" id="dl">'+t('save')+'</button><button class="btn y" id="cp">'+t('copy')+'</button><button class="btn p" id="pr">'+t('print')+'</button><button class="btn" id="again">'+t('again')+'</button></div><div class="shr"><b>'+t('shT')+'</b><div class="row" id="shr"></div></div>';
 $('again').onclick=begin;$('pr').onclick=()=>window.print();
 $('dl').onclick=()=>{const a=document.createElement('a');a.href=url;a.download='NBC-CanG-Quiz-'+r+'.png';a.click()};
 $('cp').onclick=async()=>{try{const b=await (await fetch(url)).blob();await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);$('cp').textContent=t('copied')}catch(e){$('cp').textContent='⬇ '+t('hint').split('.')[0].slice(0,18)}};
 const page=location.href,tx=t('shX',{s:score,r:rn}),e=encodeURIComponent,both=e(tx+' '+page),sr=$('shr');
 if(navigator.canShare)sr.appendChild(sbtn('#7c3aed','📤','', 'Share')).onclick=async()=>{try{const b=await (await fetch(url)).blob(),f=new File([b],'nbc-quiz.png',{type:'image/png'});await navigator.share({text:tx+' '+page,files:[f]})}catch(x){}};
 sr.appendChild(sbtn('#25d366','💬','https://wa.me/?text='+both,'WhatsApp'));
 sr.appendChild(sbtn('#229ed9','✈','https://t.me/share/url?url='+e(page)+'&text='+e(tx),'Telegram'));
 sr.appendChild(sbtn('#1877f2','f','https://www.facebook.com/sharer/sharer.php?u='+e(page)+'&quote='+e(tx),'Facebook'));
 sr.appendChild(sbtn('#111','𝕏','https://twitter.com/intent/tweet?text='+e(tx)+'&url='+e(page),'X'));
 sr.appendChild(sbtn('#ea4335','✉','mailto:?subject='+e('NaturalBornChillaz CanG Quiz')+'&body='+both,'E-Mail'));
 const ig=sbtn(BG.ig,SV.ig,'','Instagram @infotonbc');ig.onclick=async()=>{try{await navigator.clipboard.writeText(tx+' '+page)}catch(x){}alert(t('igC'));window.open(URLS.ig,'_blank','noopener')};sr.appendChild(ig);
 if(r=='gold'){fanfare();confetti()}else sfx(true)}
function confetti(){const cs=['#ffd400','#3ddc4a','#ff4fa3','#fff','#4fc3ff'];for(let i=0;i<70;i++){const d=document.createElement('i');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=cs[i%5];d.style.animationDuration=(2+Math.random()*3)+'s';d.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),6000)}}
function star(c,x,y,R,r,n){c.beginPath();for(let i=0;i<n*2;i++){const a=i*Math.PI/n-Math.PI/2,k=i%2?r:R;c.lineTo(x+Math.cos(a)*k,y+Math.sin(a)*k)}c.closePath()}
function drawCert(rank,s){const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d'),R=RK[rank],F="'Bangers','Impact',sans-serif";
 let g=c.createRadialGradient(W/2,380,50,W/2,H/2,H);g.addColorStop(0,'#2d6b43');g.addColorStop(1,'#0c1d13');c.fillStyle=g;c.fillRect(0,0,W,H);
 if(rank=='gold'){c.save();c.translate(W/2,430);for(let i=0;i<24;i++){c.rotate(Math.PI/12);c.fillStyle='rgba(255,212,0,.16)';c.beginPath();c.moveTo(0,0);c.lineTo(1500,-60);c.lineTo(1500,60);c.fill()}c.restore()}
 c.fillStyle='rgba(61,220,74,.18)';for(let y=0;y<H;y+=36)for(let x=0;x<W;x+=36){c.beginPath();c.arc(x,y,3,0,7);c.fill()}
 c.lineWidth=18;c.strokeStyle='#111';c.strokeRect(30,30,W-60,H-60);c.lineWidth=8;c.strokeStyle=R[0];c.strokeRect(52,52,W-104,H-104);
 c.textAlign='center';c.lineJoin='round';
 function T(txt,y,sz,fill,sw){c.font=sz+'px '+F;c.lineWidth=sw||12;c.strokeStyle='#111';c.strokeText(txt,W/2+6,y+6);c.fillStyle='#111';c.fillText(txt,W/2+6,y+6);c.strokeText(txt,W/2,y);c.fillStyle=fill;c.fillText(txt,W/2,y)}
 // Logo
 const lh=400,lw=lh*logoImg.width/logoImg.height||310;c.save();c.beginPath();c.roundRect(W/2-lw/2,75,lw,lh,28);c.clip();c.drawImage(logoImg,W/2-lw/2,75,lw,lh);c.restore();
 c.lineWidth=10;c.strokeStyle='#ffd400';c.beginPath();c.roundRect(W/2-lw/2,75,lw,lh,28);c.stroke();
 T('CanG Quiz · '+t('cert'),545,62,'#3ddc4a',10);
 const my=730;g=c.createLinearGradient(W/2-170,my-170,W/2+170,my+170);g.addColorStop(0,R[0]);g.addColorStop(1,R[1]);
 c.beginPath();c.arc(W/2,my,150,0,7);c.fillStyle=g;c.fill();c.lineWidth=14;c.strokeStyle='#111';c.stroke();
 c.fillStyle='#fff8dc';star(c,W/2,my-4,100,44,5);c.fill();c.lineWidth=9;c.stroke();
 T(t('rw',{R:t(rank).toUpperCase()}),960,rank=='gold'?130:115,R[0],16);
 T(t('sc',{s:s}),1060,rank=='gold'?72:76,'#fff8dc',12);
 c.font='900 32px Nunito,Arial,sans-serif';c.fillStyle='#fff8dc';c.fillText(t(R[2]),W/2,1125);
 // Social-Banner
 c.fillStyle='#ffd400';c.strokeStyle='#111';c.lineWidth=8;c.beginPath();c.roundRect(150,1160,780,110,30);c.fill();c.stroke();
 c.fillStyle='#111';c.font='82px '+F;c.fillText('@infotonbc',W/2,1240);
 c.font='700 26px Nunito,Arial,sans-serif';c.fillStyle='#fff8dc';c.fillText('instagram.com/infotonbc  ·  youtube.com/@infotonbc  ·  '+new Date().toLocaleDateString(LC[L]),W/2,1305);
 if(rank=='gold'){c.fillStyle='#ffd400';[[130,620,40],[950,620,40],[160,900,28],[920,900,28],[110,330,22],[970,330,22]].forEach(a=>{star(c,a[0],a[1],a[2],a[2]/2.3,5);c.fill();c.lineWidth=5;c.strokeStyle='#111';c.stroke()})}
 return cv.toDataURL('image/png')}
